# 条件 D: VariationalLoRA (ゲート固定0.5) — 機構分離 (SPEC §4.2)
#
# quad_weight を学習させず定数 0.5 に固定し、cont と disc を等 weight で合成する。
# ゲート動的性 (C) の寄与を分離するための条件。C ≈ D ならゲートの動的性は不要。
condition: D

model_name: Qwen/Qwen2.5-Coder-7B
dataset: data/m1_train.jsonl
text_field: text
max_seq_length: 1024
output_dir: outputs/cond_D

# アダプタ (VariationalLoRA, ゲート固定)
r0: 16
alpha: 32
lora_dropout: 0.05
n_quad: 3
fixed_gate: 0.5      # quad_weight を 0.5 に固定 (学習しない)

use_4bit: true

# 統制変数 (A/B/C と同一)
num_train_epochs: 3.0
learning_rate: 1.0e-4
warmup_ratio: 0.03
lr_scheduler_type: cosine
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_grad_norm: 1.0
gradient_checkpointing: true
seed: 0
logging_steps: 5
save_steps: 200
fp16: true
bf16: false
