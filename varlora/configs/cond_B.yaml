# 条件 B: 標準 LoRA (rank 拡大で C とパラメータ数一致) — 交絡対照 (SPEC §4.2, §2.4)
#
# rank は train.py が module 形状から自動算出する (build_standard_lora_peft_config の
# n_quad_for_match=n_quad)。「増えただけ」を C から分離するための地味だが必須の条件。
condition: B

model_name: Qwen/Qwen2.5-Coder-7B
dataset: data/m1_train.jsonl
text_field: text
max_seq_length: 1024
output_dir: outputs/cond_B

# アダプタ — r0 と n_quad は C と一致させる (rank 一致計算の入力)
r0: 16
alpha: 32
lora_dropout: 0.05
n_quad: 3        # C のパラメータ数に一致させる rank 計算に使用

use_4bit: true

# 統制変数 (A と同一)
num_train_epochs: 3.0
learning_rate: 1.0e-4
warmup_ratio: 0.03
lr_scheduler_type: cosine
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_grad_norm: 1.0
gradient_checkpointing: true
seed: 0
logging_steps: 5
save_steps: 200
fp16: true
bf16: false
