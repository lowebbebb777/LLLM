[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltafem-llm"
version = "0.1.0"
description = "FEM-inspired weighted residual and dynamic activation-delta research tools for LLMs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
